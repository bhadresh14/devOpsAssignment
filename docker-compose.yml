services:
  hello-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: hello-service:latest
    container_name: hello-service
    ports:
      - "8080:8080"
    environment:
      GREETING: ${GREETING:-Hello}
      NAME: ${NAME:-World}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped